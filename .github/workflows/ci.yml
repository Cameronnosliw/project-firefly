name: CI

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spoondb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/spoondb?createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
          SPRING_SQL_INIT_MODE: always
        run: ./mvnw -B verify

      - name: Generate test report
        if: always()
        run: |
          chmod +x .github/scripts/generate-test-report.sh .github/scripts/update-readme.sh
          .github/scripts/generate-test-report.sh test-report.md
          .github/scripts/update-readme.sh test-report.md README.md

      - name: Commit updated README
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Update test report in README [skip ci]"
            git push
          else
            echo "No change to README.md"
          fi
